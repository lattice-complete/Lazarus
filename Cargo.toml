[workspace]
resolver = "2"
members = [
    "labrador",
    "algebra",
    "greyhound"
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rand = "0.8"
rayon = "1.10.0"

# RNG / hashing backends for the sampling layer (RustCrypto, pure Rust)
sha3 = "0.10"
aes = "0.8"
ctr = "0.9"

# profiler deps
ark-std = { version = "0.4.0" }
profiler_macro = { git ="https://github.com/SuccinctPaul/profiler-rs.git", tag = "v0.1.0" }

[workspace.features]
profiler = ["ark-std/print-trace"]